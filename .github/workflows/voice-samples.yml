# Provinspelningar av Morgonsoffans röst (körs när skriptet ändras eller manuellt).
name: Röstprov
on:
  push:
    branches: [main]
    paths: ['scripts/voice_samples.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts==7.3.1
      - run: python scripts/voice_samples.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rostprov
          git diff --cached --quiet || (git commit -m "Röstprov för Morgonsoffan" && git pull --rebase -q origin main && git push origin HEAD:main)
