# Live-bevakning under börsdagen: anropar appens live-kontroll var 10:e minut
# (mål, stopp, säljdagar, förvarningar, coachen och Månadens aktier).
# GitHubs schemaläggning hoppar ofta över körningar, så jobbet är självgående:
# varje omgång kör i upp till 5 timmar och startar sedan nästa omgång själv, dygnet
# runt, så att kedjan aldrig behöver startas om. Appen anropas bara vardagar
# 06.45–21.15 UTC (07.45/08.45–22.15/23.15 svensk tid); övrig tid väntar jobbet.
# De schemalagda starterna nedan är bara reserv om kedjan skulle brytas.
# Stoppa kedjan genom att stänga av arbetsflödet under Actions (Disable workflow).
name: Live-bevakning
on:
  schedule:
    - cron: '7 7,10,13,16,19 * * 1-5'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      # Bara en omgång åt gången: kör redan en äldre omgång avslutar den här sig själv.
      # (GitHubs kö kan avbryta väntande körningar, därför används den inte.)
      - name: Kontrollera att ingen annan omgång kör
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Omgången som startade den här är på väg att avslutas – vänta upp till 3 minuter på den.
          for i in $(seq 1 18); do
            older=$(gh run list --repo "${{ github.repository }}" --workflow live.yml --status in_progress --json databaseId --jq "[.[] | select(.databaseId < ${{ github.run_id }})] | length" || echo 0)
            [ "${older:-0}" -eq 0 ] && exit 0
            sleep 10
          done
          echo "En äldre omgång kör redan – avslutar."; echo "skip=1" >> "$GITHUB_OUTPUT"
      - name: Anropa live-kontrollen var 10:e minut
        if: steps.guard.outputs.skip != '1'
        env:
          KEY: ${{ secrets.CRON_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          inside() { d=$(date -u +%u); t=$((10#$(date -u +%H%M))); [ "$d" -le 5 ] && [ "$t" -ge 645 ] && [ "$t" -le 2115 ]; }
          end=$(( $(date +%s) + 5 * 3600 ))
          # Morgonsoffans ljud: startas härifrån så fort dagens session finns men saknar ljud
          # (GitHubs eget schema för ljudjobbet startar ofta flera timmar för sent).
          audio() {
            d=$(date -u +%u); t=$((10#$(date -u +%H%M))); [ "$d" -le 5 ] && [ "$t" -ge 600 ] && [ "$t" -le 1100 ] || return 0
            today=$(TZ=Europe/Stockholm date +%F)
            info=$(curl -fsS -m 60 "https://omx-analys.vercel.app/api/morning" | jq -r '[.morning.date // "", (.morning.audio != null)] | @tsv') || return 0
            sdate=$(echo "$info" | cut -f1); has=$(echo "$info" | cut -f2)
            [ "$sdate" = "$today" ] && [ "$has" = "false" ] || return 0
            last=$(cat /tmp/audio_started 2>/dev/null || echo 0)
            [ $(( $(date +%s) - last )) -ge 1200 ] || return 0   # högst ett försök per 20 minuter
            gh workflow run morning-audio.yml --repo "${{ github.repository }}" && date +%s > /tmp/audio_started && echo "Startade Morgonsoffans ljud"
          }
          while [ "$(date +%s)" -lt "$end" ]; do
            if inside; then
              curl -fsS -m 90 "https://omx-analys.vercel.app/api/cron/live?key=${KEY}" || echo "Anropet misslyckades, försöker igen om 10 minuter"
              echo
            fi
            audio || true
            sleep 600
          done
      - name: Starta nästa omgång
        if: always() && steps.guard.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run live.yml --repo "${{ github.repository }}" && echo "Nästa omgång startad"
