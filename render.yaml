services:
  - type: web
    name: omx-analys
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: npm start
    envVars:
      - key: APP_URL
        sync: false
      - key: NTFY_TOPIC
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
